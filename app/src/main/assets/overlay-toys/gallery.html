<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      padding: 10px 10px 24px;
    }
    #gallery {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    .avatar-card {
      min-height: 105px;
      padding: 8px 4px 6px;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: rgba(140, 155, 185, .08);
      border: 1.5px solid rgba(140, 150, 180, .20);
      color: var(--label, #94a3b8);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s ease, border-color 0.12s ease, background-color 0.12s ease, box-shadow 0.12s ease;
      position: relative;
      touch-action: manipulation;
    }
    .avatar-card:active {
      transform: scale(0.94);
    }
    .avatar-card.selected {
      border: 2px solid var(--accent, #00f0ff);
      background: rgba(0, 240, 255, .14);
      box-shadow: 0 0 18px rgba(0, 240, 255, .30);
      color: #ffffff;
    }
    .avatar-name {
      font-size: 11px;
      font-weight: 700;
      line-height: 14px;
      text-transform: capitalize;
      letter-spacing: 0.02em;
    }
    .avatar-card.selected .avatar-name {
      color: var(--accent, #00f0ff);
    }
    .badge {
      display: none;
      position: absolute;
      top: 6px;
      right: 6px;
      width: 17px;
      height: 17px;
      border-radius: 50%;
      background: var(--accent, #00f0ff);
      color: #000;
      font-size: 11px;
      font-weight: bold;
      line-height: 17px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
    .avatar-card.selected .badge {
      display: block;
    }
    .avatar-image {
      width: 66px;
      height: 60px;
      display: block;
      overflow: visible;
    }
  </style>
</head>
<body>
  <div id="gallery"></div>
  <script>
    // Two Grok Bots (Grok Cyber & Grok Chibi) + Full Original Roster
    const avatars = [
      ["droid", "#00d4ff", "#e0f2fe", "Droid"],
      ["grok bot", "#00f0ff", "#a855f7", "Grok Cyber"],
      ["grok chibi", "#ff69b4", "#00ffff", "Grok Chibi"],
      ["cat", "#f47b24", "#ffc462", "Cat"],
      ["ghost", "#d8e0ed", "#ffffff", "Ghost"],
      ["alien", "#70d920", "#b9fb54", "Alien"],
      ["flower", "#20cf70", "#a6ff72", "Flower"],
      ["star", "#f1ce48", "#fff39a", "Star"],
      ["cloud", "#a9bddb", "#edf5ff", "Cloud"],
      ["drop", "#08c7c0", "#61fff0", "Drop"],
      ["blob", "#04bd70", "#82ffb3", "Blob"],
      ["mech", "#7895c9", "#c4d7ff", "Mech"],
      ["pebble", "#9dcf69", "#d6f49c", "Pebble"],
      ["pill", "#8885d8", "#d0c9ff", "Pill"],
      ["puddle", "#ed69bb", "#ffa7dc", "Puddle"],
      ["hexagon", "#ed4847", "#ff9990", "Hexagon"],
      ["triangle", "#b438d4", "#ee85ff", "Triangle"],
      ["circle", "#862deb", "#bd7cff", "Circle"],
      ["square", "#21a9dc", "#88eaff", "Square"],
      ["metamuse", "#9d00ff", "#00f0ff", "MetaMuse"]
    ];

    const shapes = {
      droid: '<path d="M38 14V8q0-4 4-4t4 4v7q16 3 16 17v17q0 10-11 10H29q-11 0-11-10V31q0-14 20-17z"/>',
      "grok bot": '<circle cx="40" cy="35" r="19"/><circle cx="40" cy="35" r="26" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="8 6"/>',
      "grok chibi": '<circle cx="40" cy="37" r="20"/><path d="M26 21L30 30M54 21L50 30" stroke="#ff69b4" stroke-width="3" stroke-linecap="round"/><circle cx="26" cy="20" r="3.5" fill="#00ffff"/><circle cx="54" cy="20" r="3.5" fill="#00ffff"/>',
      metamuse: '<path d="M18 28 16 10l16 10q8-3 16 0l16-10-2 19q6 9 2 20-6 13-24 13T20 49q-6-10-2-21z"/>',
      cat: '<path d="M18 28 16 10l16 10q8-3 16 0l16-10-2 19q6 9 2 20-6 13-24 13T20 49q-6-10-2-21z"/>',
      ghost: '<path d="M17 55V32q0-24 23-24t23 24v24q0 5-5 3l-6-5-7 5-7-5-7 5-7-5-6 5q-4 2-4-4z"/>',
      alien: '<ellipse cx="40" cy="37" rx="23" ry="23"/>',
      flower: '<path d="M40 10q10-12 17 0 4 6 0 13 14-5 17 8 2 10-10 14 11 7 4 17-6 9-18 2-2 15-14 15-11 0-12-15-13 8-19-2-6-10 5-17Q-2 39 2 29q4-11 18-6-5-14 5-19 9-5 15 6z" transform="translate(2 2) scale(.95)"/>',
      star: '<path d="m40 7 9 18 20 3-15 14 4 21-18-10-18 10 4-21L11 28l20-3z"/>',
      cloud: '<path d="M21 51q-12-1-12-13 0-11 13-13 4-15 20-12 12 1 14 14 15 1 15 13 0 12-14 12H22z"/>',
      drop: '<path d="M40 7Q34 19 22 32 9 47 22 58q16 13 33 0 13-11 0-26Q44 18 40 7z"/>',
      blob: '<path d="M18 37C15 24 25 14 36 18c8-8 24-2 25 9 12 7 7 27-5 29-8 10-24 5-27-1-10 1-16-8-11-18z"/>',
      mech: '<path d="M38 15V8q0-4 4-4t4 4v7q17 3 17 18v17q0 11-12 11H29Q17 61 17 50V33q0-15 21-18z"/>',
      pebble: '<path d="M15 42q-3-15 11-24 16-10 34 0 15 9 7 25-7 14-29 15-20 1-23-16z"/>',
      pill: '<rect x="12" y="19" width="56" height="36" rx="18"/>',
      puddle: '<path d="M17 48q-8-13 6-21 3-16 18-14 11-1 16 11 16 5 10 21-6 14-24 12-20 7-26-9z"/>',
      hexagon: '<path d="M25 12h30l17 24-17 24H25L8 36z"/>',
      triangle: '<path d="M34 12q6-10 12 0l25 40q5 9-6 9H15q-11 0-6-9z"/>',
      circle: '<circle cx="40" cy="36" r="24"/>',
      square: '<rect x="16" y="12" width="48" height="48" rx="11"/>'
    };

    function icon(id, color, light) {
      const antenna = (id === "droid" || id === "mech") ? '<path d="M40 15V7" stroke="#64748b" stroke-width="3" stroke-linecap="round"/><circle cx="40" cy="5" r="3.5" fill="#38bdf8"/>' : "";
      const arms = (id === "mech" || id === "droid") ? '<path d="M15 36h-4m58 0h-4" stroke="#64748b" stroke-width="4.5" stroke-linecap="round"/>' : "";
      const safeId = id.replace(/\s+/g, '-');
      const shapeContent = shapes[id] || shapes["circle"];
      return `<svg class="avatar-image" viewBox="0 0 80 70" aria-hidden="true">
        <defs>
          <linearGradient id="g-${safeId}" x1="0" y1="0" x2="1" y2="1">
            <stop stop-color="${light}"/>
            <stop offset="1" stop-color="${color}"/>
          </linearGradient>
        </defs>
        ${antenna}${arms}
        <g fill="url(#g-${safeId})" stroke="rgba(30,41,59,.25)" stroke-width="1.3">
          ${shapeContent}
        </g>
        <!-- Cute Glossy Eyes -->
        <circle cx="32" cy="35" r="3.2" fill="#0f172a"/>
        <circle cx="33" cy="34" r="1.1" fill="#ffffff"/>
        <circle cx="48" cy="35" r="3.2" fill="#0f172a"/>
        <circle cx="49" cy="34" r="1.1" fill="#ffffff"/>
        <!-- Cute Blush -->
        <circle cx="26" cy="38" r="2.2" fill="#f43f5e" opacity="0.45"/>
        <circle cx="54" cy="38" r="2.2" fill="#f43f5e" opacity="0.45"/>
        <!-- Happy Smile -->
        <path d="M34 43q6 4.5 12 0" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
      </svg>`;
    }

    function selectAvatarClick(id) {
      try {
        if (window.JarvisAvatarPicker && window.JarvisAvatarPicker.selectAvatar) {
          window.JarvisAvatarPicker.selectAvatar(id);
        }
        if (window.AndroidBridge && window.AndroidBridge.selectAvatar) {
          window.AndroidBridge.selectAvatar(id);
        }
      } catch (e) {
        console.error(e);
      }
      window.setSelectedAvatar(id);
    }

    const galleryEl = document.getElementById("gallery");
    galleryEl.innerHTML = avatars.map(([id, color, light, label]) => {
      const safeId = id.replace(/\s+/g, '-');
      return `<div id="avatar-${safeId}" class="avatar-card" role="button" tabindex="0" onclick="selectAvatarClick('${id}')">
        <div class="badge">✓</div>
        ${icon(id, color, light)}
        <span class="avatar-name">${label}</span>
      </div>`;
    }).join("");

    window.setSelectedAvatar = id => {
      const safeId = (id || "").toLowerCase().trim().replace(/\s+/g, '-');
      document.querySelectorAll(".avatar-card").forEach(card => card.classList.remove("selected"));
      const target = document.getElementById(`avatar-${safeId}`);
      if (target) {
        target.classList.add("selected");
      }
    };

    window.setGalleryTheme = (label, accent) => {
      document.documentElement.style.setProperty("--label", label);
      document.documentElement.style.setProperty("--accent", accent);
    };

    // Notify Android when ready
    if (window.JarvisAvatarPicker && window.JarvisAvatarPicker.pageReady) {
      window.JarvisAvatarPicker.pageReady();
    }
    if (window.AndroidBridge && window.AndroidBridge.pageReady) {
      window.AndroidBridge.pageReady();
    }
  </script>
</body>
</html>
